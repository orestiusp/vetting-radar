name: Monitor sources and deploy site

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit updated snapshots/state back
  pages: write
  id-token: write

concurrency:
  group: monitor-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt

      - name: Run change monitor
        run: python scripts/monitor.py

      - name: Build static site
        run: python scripts/build.py

      - name: Commit updated data and snapshots
        if: github.ref == 'refs/heads/main'
        # Commits pushed with GITHUB_TOKEN do not trigger workflows, and [skip ci] is a second guard against loops.
        run: |
          git config user.name "Vetting Radar"
          git config user.email "orestiusp@users.noreply.github.com"
          git add -A data snapshots changes newsletter
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(monitor): update snapshots and state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # only main is ever deployed; pushes/dispatches on other branches (e.g. redesign) never publish
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
