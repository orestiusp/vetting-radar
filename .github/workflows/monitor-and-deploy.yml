name: Monitor sources and deploy site

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: nothing at workflow level; each job asks only for what it needs.
permissions: {}

concurrency:
  group: monitor-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # commit updated snapshots/state back (main only)
      pages: read       # configure-pages reads the Pages site config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt

      - name: Run change monitor
        run: python scripts/monitor.py

      - name: Build static site
        run: python scripts/build.py

      - name: Commit updated data and snapshots
        if: github.ref == 'refs/heads/main'
        # Commits pushed with GITHUB_TOKEN do not trigger workflows, and [skip ci] is a second guard against loops.
        run: |
          git config user.name "Vetting Radar"
          git config user.email "orestiusp@users.noreply.github.com"
          git add -A data snapshots changes newsletter
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(monitor): update snapshots and state $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # only main is ever deployed; pushes/dispatches on other branches (e.g. redesign) never publish
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
